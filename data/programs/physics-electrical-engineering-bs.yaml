  policies:
  - General education requirements for mathematics, nature of science, information literacy and research, impact
    of technology, and philosophy and ethics are met through the major.
  - Additional information can be found in the Electrical and Computer Engineering section of the College of Engineering
    and Technology.
  - All majors for the BS degree in physics require completion of a minimum of 120 credit hours (150 credit hours
    for the dual degree in physics and electrical engineering and the dual degree in physics and the Master of Business
    Administration), which must include both a minimum of 30 credit hours overall and 12 credit hours in upper-level
    courses in the major program from Old Dominion University, completion of ENGL 110C, ENGL 211C or ENGL 231C,
    and the writing intensive (W) course in the major with a grade of C or better, and Senior Assessment.
  - Additionally, physics majors require completion of the Physics Exit Exam with a minimum score of 20th percentile,
    and the astrophysics major requires completion of the Astrophysics Exit Exam with a minimum score of 20th percentile.
  - Additional hours may be required to meet the foreign language requirement.
  - All majors require a minimum grade of C in PHYS 261N-PHYS 262N, PHYS 231N-PHYS 232N, or PHYS 226N-PHYS 227N.
  - Except for the secondary physics education major, physics majors require a minimum cumulative grade point average
    of 2.00 overall and in the major.
  - The secondary physics education major requires a minimum 2.75 grade point average overall, in the major, and
    in the professional education core, with no grade less than a C- in the major and professional education core.
  - The professional education core satisfies the upper-level general education requirement.
  - Students in this major must earn a minimum of 150 credit hours.
  - Qualified students may receive the BS degree with honors (to be noted on their diplomas) by completing specified
    additional requirements.
  - At the time of application for this designation, a student must have a GPA of 3.50 or higher in physics, a GPA
    of 3.25 or higher overall, must have completed two contract honors courses, and must have completed 60 credit
    hours (of which at least 54 must be in grade-point graded courses) at Old Dominion University.
  - (Contract honors courses are specialized courses of individual study under the direct supervision of a professor.
    Permission to take these courses is granted jointly by the Department of Physics and the Honors College.).
  footnotes:
  - {marker: '*', text: Grade of C or better required in PHYS 499W or both PHYS 489W and PHYS 490W}
  plan_notes:
  - The General Education requirements in information literacy and research, impact of technology, and philosophy
    and ethics are met through the Electrical Engineering major/degree. The upper-division General Education requirement
    is met through the completion of a second major/degree.
  - Electrical engineering majors must earn a grade of C or better in all 200-level ECE courses prior to taking
    the next course in the sequence.
  - Any ECE course registration issues are to be resolved with the ECE Academic Coordinator and Program Manager.
  plan_footnotes:
  - {marker: '*', text: Does not include the University's General Education language and culture requirement. Additional
      hours may be required.}
  - {marker: '1', text: ENGN 121 satisfies both the Physics Approved Seminar requirement and the PHYS Information
      Literacy and Research requirement in the Physics curriculum.}
  - {marker: '2', text: ECE 287 satisfies the PHYS 303 requirement in the Physics curriculum.}
  - {marker: '3', text: PHYS 425 satisfies the Nonmajor Engineering Elective requirement in the Electrical Engineering
      curriculum.}
  - {marker: '4', text: PHYS 453 and PHYS 456 offered spring semester only.}
  - {marker: '5', text: 'Electrical Engineering students need four technical elective courses selected from one
      of two options: (1) four 400-level ECE technical elective courses; (2) three 400-level ECE technical elective
      courses and one 300-level ECE technical elective course or one approved 300- or 400-level CS/MATH/Engineering
      course.'}
  - {marker: '6', text: ENMA 480 satisfies the PHYS Philosophy & Ethics requirement in the Physics curriculum.}
