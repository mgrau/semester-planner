name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a deploy to be triggered by hand from the Actions tab.
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken engine should never reach the site. The suite runs end-to-end against the
      # real scraped catalog, so this also catches a bad data refresh.
      - name: Test
        run: npm test

      - name: Type-check
        run: npm run check

      - name: Build
        env:
          # Project pages are served from /<repo>/, which is the app's base path.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # GitHub Pages serves 404.html for any unmatched path. Pointing it at the SPA shell is
      # what makes a deep link like /print work on a refresh.
      - name: Add SPA fallback
        run: cp build/index.html build/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
