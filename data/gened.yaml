- id: impact
  name: Impact of Technology
  group: Ways of Knowing
  credits: 3
  notes: |-
    Select one of the following courses

    Thinking critically about technology requires understanding how technologies and technological systems reflect and perpetuate our values, our biases, and our ways of understanding ourselves, each other, and the world.

    Courses in the Impact of Technology Way of Knowing are intended to develop students' ability to make reasoned judgments about the meaning and impact of technology by understanding that technologies and technological systems are not value-neutral but are influenced by social and cultural forces and also influence society and culture.

