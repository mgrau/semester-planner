  policies:
  - Requirements for graduation include completion of ENGL 110C, ENGL 211C or ENGL 231C, and the writing intensive
    (W) course in the major with a grade of C or better, completion of the Senior Assessment, completion of the
    Physics Exit Exam with a minimum score of 20th percentile, a minimum cumulative 2.75 GPA, in the major area,
    and in the professional education core, with no grade less than a C- in the major and the professional education
    core; successful completion of the Teacher Candidate Internship and a minimum of 120 credit hours, which must
    include both a minimum of 30 credit hours overall and 12 credit hours in upper-level courses in the major program
    from Old Dominion University.
  - Licensure requirements also include certificate of completion in First Aid/AED/CPR, Dyslexia Awareness Training,
    Child Abuse and Neglect Recognition and Intervention Training, and Regulations Governing the Use of Restraint
    and Seclusion in Elementary and Secondary Schools, and Cultural Competence Training.
  - Elective credit may be needed to meet the minimum requirement of 120 credit hours.
  - Qualified students may receive the BS degree with honors (to be noted on their diplomas) by completing specified
    additional requirements.
  - At the time of application for this designation, a student must have a GPA of 3.50 or higher in physics, a GPA
    of 3.25 or higher overall, must have completed two contract honors courses, and must have completed 60 credit
    hours (of which at least 54 must be in grade-point graded courses) at Old Dominion University.
  - (Contract honors courses are specialized courses of individual study under the direct supervision of a professor.
    Permission to take these courses is granted jointly by the Department of Physics and the Honors College.).
  - Due to changing University requirements, national accreditation standards, and the Virginia Board of Education
    licensure regulations, the teacher preparation programs in the College of Sciences are under constant revision.
  - Any changes resulting from these factors supersede the program requirements described in this Catalog.
  - Students are encouraged to obtain current program information from their advisors and the Office of Clinical
    Experiences website at https://www.odu.edu/oce.
  - Students must first declare secondary physics education as their major with the physics departmental advisor.
  - All students must apply for and be admitted into the approved secondary physics education program.
  - Students must meet the required criteria for admission by earning the minimum required grade point averages
    (GPA).
  - A cumulative GPA of 2.75 is required.
  - A major/content GPA of 2.75 is required - all physics courses and all other science content courses must be
    passed with a grade of C- or higher.
  - A professional education GPA of 2.75 is required – all professional education courses must be passed with a
    grade of C- or higher.
  - Although students may enroll in a limited number of education courses, students must be admitted into the approved
    physics teacher preparation program prior to enrolling in any instructional strategies practicum education course.
  - Students must also meet with an education advisor in the Office of Clinical Experiences.
  - Students must maintain a cumulative GPA of 2.75, a major/content GPA of 2.75 and a professional education GPA
    of 2.75.
  - Physics courses must be passed with a grade of C- or higher.
  - The remaining courses required for the major and in the professional education core must be completed with a
    grade of C- or higher for continuance.
  - A professional education GPA of 2.75 is required for continuance.
  - Students must take and pass the Praxis Subject Assessment, Physics content knowledge (formerly Praxis II) prior
    to or while enrolled in the instructional strategies course.
  - All assessments must be passed prior to the start of the Teacher Candidate Internship Orientation session.
  - Old Dominion University requires a background clearance check of candidates interested in many of the professional
    education programs.
  - Professional education programs have several field experiences that are required for continuance and graduation
    from the program.
  - The background clearance must be successfully completed prior to a field experience placement.
  - Candidates will be provided a field experience placement when the background check process is completed with
    resolution of any issues.
  - 'The process to complete the ODU clearance background check is located at: http://www.odu.edu/success/academic/teacher-education/placement/background-checks.'
  - 'The ODU clearance process includes: an FBI fingerprint, a child protective service/social service review, and
    a Virginia State Police sex offender registry review.'
  - Candidates interested in the professional education programs are advised to complete this clearance process
    immediately upon entry into the program since the clearance process takes a minimum of eight weeks to complete.
  - 'Praxis Subject Assessment, Physics content knowledge (test code: 5266) – passing score of 145 is required.'
  - 'Students are encouraged to complete the following courses (or their approved equivalents) prior to taking the
    Praxis content knowledge licensure tests:'
  - CHEM 121N, CHEM 122N, CHEM 123N, and CHEM 124N PHYS 231N and PHYS 232N PHYS 323.
  - Please consult with your academic advisor with any questions and before registering for your licensure test.
  - To review more information on the Virginia Board of Education prescribed assessments visit the Office of Clinical
    Experiences website, www.odu.edu/oce.
