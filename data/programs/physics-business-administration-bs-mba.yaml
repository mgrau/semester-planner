  policies:
  - All majors for the BS degree in physics require completion of a minimum of 120 credit hours (150 credit hours
    for the dual degree in physics and electrical engineering and the dual degree in physics and the Master of Business
    Administration), which must include both a minimum of 30 credit hours overall and 12 credit hours in upper-level
    courses in the major program from Old Dominion University, completion of ENGL 110C, ENGL 211C or ENGL 231C,
    and the writing intensive (W) course in the major with a grade of C or better, and Senior Assessment.
  - Additionally, physics majors require completion of the Physics Exit Exam with a minimum score of 20th percentile,
    and the astrophysics major requires completion of the Astrophysics Exit Exam with a minimum score of 20th percentile.
  - Additional hours may be required to meet the foreign language requirement.
  - All majors require a minimum grade of C in PHYS 261N-PHYS 262N, PHYS 231N-PHYS 232N, or PHYS 226N-PHYS 227N.
  - Except for the secondary physics education major, physics majors require a minimum cumulative grade point average
    of 2.00 overall and in the major.
  - The secondary physics education major requires a minimum 2.75 grade point average overall, in the major, and
    in the professional education core, with no grade less than a C- in the major and professional education core.
  - The professional education core satisfies the upper-level general education requirement.
  - Students in this major must earn a minimum of 150 credit hours (120 discrete credit hours for the undergraduate
    degree and 30 discrete credit hours for the graduate degree).
  - MBA courses may be taken beginning with the second semester of the junior year.
  - Students must maintain a 3.0 grade point average in these courses to continue in the program.
  - Additional information can be found in the section on BS/MBA Dual Dominion Program at the beginning of the College
    of Sciences section of this Catalog and the Strome College of Business section in the Graduate Catalog.
  footnotes:
