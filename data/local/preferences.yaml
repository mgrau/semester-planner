# Departmental advising preferences.
#
# NOT scraped — this file is maintained by hand and is safe from `--refresh`. It records how the
# ODU Physics department actually advises, where that differs from (or is not stated by) the
# catalog. The planner consults it when a requirement offers a genuine choice.
#
# Edit freely. Codes must match catalog codes exactly, e.g. "PHYS 489W".

meta:
  maintained_by: ODU Physics chief departmental advisor
  note: Advising practice, not catalog fact. The catalog remains the authority on what is required.

# Courses the planner should reach for first when a requirement offers a choice.
# Earlier entries win over later ones.
prefer:
  # The department prefers the two-semester senior thesis sequence over the one-semester
  # capstone. Both satisfy the same 3-credit requirement.
  - PHYS 489W
  - PHYS 490W

# Courses the planner should choose only when nothing preferred fits.
avoid:
  - PHYS 499W

# Short program names for the roster and student header. The catalog's official names
# ("Physics with a Major in Astrophysics (BS)") are too long to scan in a list, and the degree
# letters are not what distinguishes one advisee from another.
program_labels:
  physics-bs: Physics
  physics-astrophysics-bs: Astrophysics
  physics-professional-bs: Physics (Professional)
  physics-electrical-engineering-bs: Physics & Electrical Eng.
  physics-business-administration-bs-mba: Physics & MBA
  physics-secondary-education-6-12-bs: Physics Education
  physics-minor: Physics Minor

# Gen-ed categories the catalog defines by a rule rather than an enumerated course list.
# `attributes: [W]` matches any Writing Intensive course.
category_filters:
  upper-division-writing-intensive:
    attributes: [W]
    note: >-
      Satisfied by any Writing Intensive (W) course. The catalog additionally requires it be
      taken in the major, with a grade of C or better — verify that when choosing the course.

  # The catalog gives four options rather than one number: A and B are 12-hour minors, C is an
  # approved certification programme, D is six hours of upper-division work. Six is the floor,
  # so that is what the panel asks for.
  #
  # No filter, deliberately. Option D requires work "from outside of and not required by the
  # student's major *and college*", which for a physics major rules out the mathematics courses
  # the plan already contains — they are in the same college. Deciding whether a given course
  # counts needs judgement the app does not have, so mark this satisfied by hand.
  upper-division-outside-major:
    credits: 6
    note: >-
      Met by a minor or second major (Option A), an interdisciplinary minor (Option B), an
      approved certification programme such as teaching licensure (Option C), or six hours of
      upper-division work outside the major and college (Option D). Not tracked automatically —
      mark it satisfied once the route is settled.

# What an incoming student already brings, offered as checkboxes when creating one.
#
# These are the entry conditions the catalog assumes but does not record as ODU credit — a
# placement result, a high-school course. Declaring them up front means the planner does not
# have to guess, and the advisor is not asked to confirm an assumption the app invented.
#
# `grants` may contain:
#   - {course: CODE, credits: N}  an ODU course equivalency that counts toward the degree.
#   - {places_past: CODE}         satisfies CODE as a prerequisite but awards NO credit. This is
#                                 placement, not coursework, so it never appears as earned credit.
#   - {satisfies: "text"}         silences prerequisite prose matching that text, e.g. the
#                                 writing placement note on ENGL 110C.
#   - {satisfies_category: id}    marks a gen-ed category satisfied outright, e.g. a Language
#                                 and Culture waiver earned in high school.
starting_preparation:
  # --- Entry conditions: true of a typical incoming major, and carrying no credit -----------
  - id: writing-placement
    group: Placement and background
    label: Passed the Writing Success Placement Tool
    detail: Required before registering for ENGL 110C.
    default: true
    grants:
      - { satisfies: Writing Success Placement Tool }

  - id: hs-chemistry
    group: Placement and background
    label: High school chemistry
    detail: Satisfies the background CHEM 121N expects.
    default: true
    grants:
      - { satisfies: High school chemistry }

  - id: language-requirement
    group: Placement and background
    label: Language and Culture requirement fulfilled
    detail: Usually met by high school coursework. Frees the 6 credits it would otherwise reserve.
    default: true
    grants:
      - { satisfies_category: language }

  - id: calculus-ready
    group: Placement and background
    label: Ready for Calculus I
    detail: >-
      Placed past precalculus. Satisfies MATH 211's prerequisite without awarding credit —
      tick a course below instead if the student actually earned the credit.
    default: true
    grants:
      - { places_past: MATH 163 }
      - { places_past: MATH 166 }
      - { places_past: MATH 162M }

  # --- Credit actually earned: transfer, AP, or dual enrollment. Highest first. -------------
  # ODU's ladder is MATH 162M -> MATH 163 (or MATH 166, the two combined) -> 211 -> 212.
  # There is no MATH 161. Each entry also places past everything below it, so prerequisites
  # resolve without inventing credit the student does not hold.
  - id: math-212
    group: Mathematics already earned
    label: MATH 212 — Calculus II (4 cr)
    grants:
      - { course: MATH 212, credits: 4 }
      - { places_past: MATH 211 }
      - { places_past: MATH 163 }
      - { places_past: MATH 166 }
      - { places_past: MATH 162M }

  - id: math-211
    group: Mathematics already earned
    label: MATH 211 — Calculus I (4 cr)
    grants:
      - { course: MATH 211, credits: 4 }
      - { places_past: MATH 163 }
      - { places_past: MATH 166 }
      - { places_past: MATH 162M }

  - id: math-163
    group: Mathematics already earned
    label: MATH 163 — Precalculus II (3 cr)
    grants:
      - { course: MATH 163, credits: 3 }
      - { places_past: MATH 162M }

  - id: math-166
    group: Mathematics already earned
    label: MATH 166 — Precalculus I and II (4 cr)
    detail: The combined course; an alternative to 162M plus 163.
    grants:
      - { course: MATH 166, credits: 4 }
      - { places_past: MATH 162M }
      - { places_past: MATH 163 }

  - id: math-162m
    group: Mathematics already earned
    label: MATH 162M — Precalculus I (3 cr)
    grants:
      - { course: MATH 162M, credits: 3 }

# When a course is actually taught.
#
# The catalog states this for only 10 of the 126 PHYS/ASTP courses — the rest carry no
# "(Offered Fall)" note at all, and ODU publishes no rotation schedule. Where the catalog is
# silent the planner assumes a course runs every term, which will cheerfully schedule a
# fall-only course in the spring. Anything listed here overrides that assumption.
#
# Values are any of: fall, spring, summer.
term_offerings:
  # Confirmed by the department, 2026. Agrees with the catalog everywhere the catalog states a
  # term (323, 355 fall; 319 spring) and fills in the rest, which it does not.
  #
  # Fall only
  PHYS 303: [fall] # Intermediate Experimental Physics
  PHYS 323: [fall] # Modern Physics
  PHYS 355: [fall] # Mathematical Methods of Physics
  PHYS 420: [fall] # Introductory Computational Physics
  PHYS 425: [fall] # Electromagnetism I
  PHYS 452: [fall] # Introduction to Quantum Mechanics

  ASTP 414: [fall] # Relativity and Cosmology

  # Spring only
  PHYS 309: [spring] # Physics on the Back of an Envelope
  ASTP 313: [spring] # Elements of Astrophysics
  PHYS 319: [spring] # Analytical Mechanics
  PHYS 413: [spring] # Methods of Experimental Physics
  PHYS 453: [spring] # Electromagnetism II
  PHYS 454: [spring] # Thermal and Statistical Physics
  PHYS 456: [spring] # Intermediate Quantum Mechanics

  # Deliberately absent, and why:
  #
  # These run every semester, so an unconstrained entry is both simpler and more accurate than
  # listing terms: the introductory physics sequences (PHYS 231N/232N, 261N/262N, 226N/227N),
  # the senior thesis courses (PHYS 489W/490W/499W), introductory astronomy (ASTP 103N/104N),
  # and ASTP 495.
  #
  # The upper-division electives (PHYS 411, 415, 416, 417) run sporadically rather than on a
  # fixed rotation, so no term can be recorded truthfully. Leaving them unconstrained lets the
  # planner place them anywhere; confirm availability with the department before registration.

# Which courses actually satisfy a category the program says is "satisfied by the major".
#
# The physics pages state that in prose without naming a course. Applied literally it marks the
# category satisfied before the student has taken anything, which is wrong — the category is
# satisfied *by completing the major*, not by declaring one. Naming the courses lets the
# requirement track the plan.
#
# An empty list means no waiver is needed at all: the major's own courses are already on that
# category's approved list, so the ordinary gen-ed accounting covers it.
major_satisfies_gened:
  math: [MATH 211] # calculus is not on the gen-ed mathematics list, so it has to be named
  nature: [] # PHYS 261N/262N and CHEM 121N/122N are already approved for Nature of Science

# What a transfer associate degree waives.
#
# The catalog's wording: a qualifying associate degree "meets all lower-division General
# Education requirements, except those specified as major or college requirements and
# requirements for completion of the undergraduate writing program".
#
# So the option under "Satisfied without coursework" marks every lower-division category except
# those listed here. The upper-division requirements are never waived by it: the
# writing-intensive course in the major is taken at ODU regardless.
associate_degree:
  label: Associate degree (transfer)
  excludes:
    - written # the undergraduate writing program — ENGL 110C and ENGL 211C/231C

# Courses that have to be scheduled in the same term.
#
# The catalog states this unevenly. CHEM 121N carries a real corequisite on CHEM 122N, so the
# first lecture/lab pair is already enforced — but CHEM 123N has no corequisite at all, and
# CHEM 124N lists 123N only as a *pre-or-corequisite*, which permits taking the lab a term
# later. In practice the lab accompanies its lecture, so record the pairing here.
#
# Each entry becomes a mutual corequisite: the planner places the group as a unit, and a plan
# that splits them is flagged.
taken_together:
  - [CHEM 123N, CHEM 124N] # Foundations of Chemistry II lecture and lab

# Courses ODU no longer offers.
#
# They stay in the catalog data — a returning student may hold credit for one, and the app must
# still be able to name it — but the planner will not schedule them, and a plan containing one
# is flagged.
discontinued:
  - PHYS 120 # Physics in the 21st Century. Leaves PHYS 309 as the Seminar requirement.

# Credits needed for each class standing, which is how `earliest_year` is judged.
#
# Standing is a matter of credits earned, not terms elapsed: a student who transfers in two
# years of coursework is a junior in their first term at ODU. These are the conventional
# thresholds — confirm them against the catalog for a student sitting near a boundary.
class_standing_credits:
  2: 30 # sophomore
  3: 60 # junior
  4: 90 # senior

# Courses that should not be scheduled before a given year of study.
#
# The catalog's prerequisites are necessary but not sufficient for good advising: PHYS 489W
# lists only ENGL 211C and instructor permission, so a purely prerequisite-driven planner will
# happily put Senior Thesis I in the sophomore year. Class standing is the real constraint, and
# the catalog does not encode it.
#
# 4 = senior year (terms 7-8 of a standard fall/spring plan), 3 = junior year, and so on.
earliest_year:
  PHYS 489W: 4 # Senior Thesis I
  PHYS 490W: 4 # Senior Thesis II
  PHYS 499W: 4 # Senior Thesis (the one-semester alternative)

# Readable names for requirement groups. The catalog labels many of them from the table row
# they came from — "Select two of the following:" — which says nothing on its own.
#
# A key is either a bare requirement id (applies to every program) or "<programId>:<requirementId>"
# (that program only, and it wins over the bare key). Requirement ids are the `id:` fields in
# data/programs/*.yaml.
requirement_labels:
  phys-499w-or: Senior Thesis
  phys-120-or: Seminar
  approved-physics-seminar: Seminar

  physics-astrophysics-bs:astrophysics-select-3: Electives
  physics-bs:physics-major-select-2: Electives
  physics-professional-bs:physics-professional-major-select-3: Electives

# How to present the major requirements to an advisor.
#
# The catalog lists a flat wall of ~26 requirement rows per program. This regroups the SAME
# courses into the shape the department actually thinks in. Nothing is added or dropped: every
# course a group claims comes out of the program's own requirements, and whatever no group
# claims still appears under "Other requirements".
#
# Groups are applied in order; the first one to claim a course wins.
major_view:
  applies_to:
    - physics-bs
    - physics-professional-bs
    - physics-astrophysics-bs
    - physics-electrical-engineering-bs
    - physics-business-administration-bs-mba
    - physics-secondary-education-6-12-bs

  groups:
    # `sequences` are whole alternatives. The first listed is the department's preference and is
    # what the planner schedules and what the progress bar sizes itself against.
    - id: intro-physics
      name: Physics 1 & 2
      sequences:
        - [PHYS 261N, PHYS 262N]
        - [PHYS 231N, PHYS 232N]
        - [PHYS 226N, PHYS 227N]
      note: Department strongly prefers PHYS 261N/262N. A grade of C or better is required.

    - id: physics-300
      name: Physics 300-level
      filter:
        subject: [PHYS, ASTP]
        level_min: 300
        level_max: 399

    - id: physics-400
      name: Physics 400-level
      filter:
        subject: [PHYS, ASTP]
        level_min: 400
        level_max: 499
